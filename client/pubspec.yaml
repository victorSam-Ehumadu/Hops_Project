name: client
description: "A new Flutter project."
publish_to: 'none'

version: 1.3.2-bgflare+6

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_blue_plus: ^1.34.0
  ble_peripheral: ^2.4.0
  permission_handler: ^11.3.1
  sqflite: ^2.3.0
  path: ^1.9.0
  path_provider: ^2.1.3
  uuid: ^4.3.3
  sqflite_common_ffi: ^2.3.3
  supabase_flutter: ^2.6.0
  crypton: ^2.0.1
  flutter_dotenv: ^6.0.1
  shared_preferences: ^2.3.5
  flutter_secure_storage: ^9.2.2
  crypto: ^3.0.3
  file_picker: ^8.0.0
  open_filex: ^4.3.4
  flutter_bluetooth_serial_plus: ^0.5.4
  nearby_connections: ^4.0.12
  flutter_local_notifications: ^17.0.0
  flutter_foreground_task: ^6.0.0
  audio_session: ^0.1.21
  just_audio: ^0.9.38
  share_plus: ^10.1.4
  image_picker: ^1.0.0
  google_fonts: ^6.1.0
  quick_actions: ^1.0.7
  flutter_tts: ^4.2.5
  tflite_flutter: ^0.12.1
  # Was already pulled in transitively (by share_plus); declared directly
  # now that help_screen.dart intentionally uses it to open a mailto: link,
  # rather than relying on an indirect dependency that could disappear on a
  # future `flutter pub upgrade` if whatever pulled it in stops needing it.
  url_launcher: ^6.3.0


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    # Directory form — alert.wav (the Emergency Flare siren) plus the
    # ping_*.wav notification tones (theme/ping_sound_packs.dart) all live
    # here; a future addition needs no pubspec edit, same reasoning as
    # assets/data/ below.
    - assets/sounds/
    # Directory form, not a single file: anything dropped into assets/data/
    # later (extra knowledge packs, offline lookup tables) is bundled without
    # another pubspec edit. Only files directly in the folder — subfolders
    # each need their own line.
    - assets/data/
    # Optional TFLite models (see hops_engine.dart). Currently holds only a
    # .gitkeep — the engine treats a missing model as a normal state and
    # falls back to its heuristic, so the app runs fine with this empty.
    - assets/models/
    # hops_bunny.png — the splash sprite (hops_splash_screen.dart), a 145×160
    # downscale of android/.../res/drawable/splash_bunny.png. The full-size
    # original is 1390×1536 / 2.5MB and stays where it is for the native
    # launch screen; bundling it again for a 50px sprite would be pure APK.
    - assets/images/