name: client
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0' # Updated: Prevents strict locks on futuristic SDK numbers

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  nearby_connections: ^4.3.3 # Updated: Matches your current SDK expectations
